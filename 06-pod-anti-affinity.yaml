apiVersion: v1
kind: Pod
metadata:
  name: pod-3         #  pod-3 is in node-2
  labels:
    project: roboshop    
    tier: database
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-4
  labels:
    project: roboshop
    tier: database
spec:
  affinity:
    podAntiAffinity:   # because of "podAntiAffinity"  pod-4 will goes to node-3
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: tier
            operator: In
            values:
            - database
        topologyKey: "kubernetes.io/hostname" # border is host , # Prevents Pods from running on the same host machine. # Node Level
  # When used inside podAntiAffinity, setting topologyKey: "kubernetes.io/hostname" explicitly tells Kubernetes to schedule the Pod on a different node.

  containers:
  - name: nginx
    image: nginx
    