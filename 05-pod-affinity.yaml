apiVersion: v1
kind: Pod
metadata:
  name: pod-1
  labels:
    project: roboshop         # pod-1 is in node-1 , avaiable zone is us-east-b
    tier: database
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-2
  labels:
    project: roboshop
    tier: backend
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: tier    # because of "podAffinity", pod-2 will also goes in node-1 , avaiable zone is us-east-b, same like in which pod-1 is laying in 
            operator: In
            values:
            - database
        topologyKey: topology.kubernetes.io/zone # border is AZ
  containers:
  - name: nginx
    image: nginx
    